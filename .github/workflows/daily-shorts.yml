name: Daily Shorts

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC (08:00 in Spain in summer, 07:00 in winter)
  workflow_dispatch:          # lets you also start it by hand with a button

permissions:
  contents: write

jobs:
  make-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        timeout-minutes: 15
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install anthropic google-genai "edge-tts>=7.0.0" nest_asyncio requests

      - name: Make and send the videos
        timeout-minutes: 140
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u daily_shorts_factory.py

      - name: Save topic history
        if: always()
        continue-on-error: true
        run: |
          if [ -f shorts_history.json ]; then
            git config user.name "shorts-bot"
            git config user.email "shorts-bot@users.noreply.github.com"
            git add shorts_history.json
            git diff --cached --quiet || git commit -m "Update topic history"
            git push
          else
            echo "No history file yet"
          fi
